name: locus_planner
description: Locus - Enhanced local planner for Windows. Android ready later.
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.0
  path_provider: ^2.1.2
  path: ^1.9.0
  table_calendar: ^3.1.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.5.0
  window_manager: ^0.3.8
  flutter_local_notifications: ^17.2.4
  tray_manager: ^0.2.3
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true

msix_config:
  display_name: Locus Planner
  publisher_display_name: Locus
  identity_name: com.locus.planner
  msix_version: 1.2.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
