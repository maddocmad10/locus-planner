name: locus_planner
description: Locus - Enhanced local planner for Windows.
publish_to: 'none'
version: 1.3.0+2
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.0
  path_provider: ^2.1.2
  path: ^1.9.0
  package_info_plus: ^8.3.0
  table_calendar: ^3.1.1
  fl_chart: ^0.68.0
  intl: ^0.20.3
  uuid: ^4.5.0
  window_manager: ^0.3.8
  local_notifier: ^0.1.6
  shared_preferences: ^2.3.3
  tray_manager: ^0.5.3
  file_picker: ^8.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
