name: Locus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify generated Drift code is ignored and untracked
        run: |
          git check-ignore -q lib/core/db/app_database.g.dart
          if git ls-files --error-unmatch lib/core/db/app_database.g.dart > /dev/null 2>&1; then
            echo 'lib/core/db/app_database.g.dart must not be tracked; run git rm --cached lib/core/db/app_database.g.dart'
            exit 1
          fi
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze with strict diagnostics
        run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locus-test-coverage
          path: coverage/lcov.info

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      # Optional repository secrets. Without them the APK is debug-signed and
      # is only a build check; see docs/ANDROID_RELEASE.md.
      LOCUS_KEYSTORE_BASE64: ${{ secrets.LOCUS_KEYSTORE_BASE64 }}
      LOCUS_KEYSTORE_PASSWORD: ${{ secrets.LOCUS_KEYSTORE_PASSWORD }}
      LOCUS_KEY_ALIAS: ${{ secrets.LOCUS_KEY_ALIAS }}
      LOCUS_KEY_PASSWORD: ${{ secrets.LOCUS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android application ID is not the template default
        run: |
          if grep -q 'applicationId = "com.example' android/app/build.gradle.kts; then
            echo 'Set a real applicationId in android/app/build.gradle.kts'
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Configure release signing
        if: ${{ env.LOCUS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$LOCUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/locus-release.jks"
          echo "LOCUS_KEYSTORE_FILE=$RUNNER_TEMP/locus-release.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release
      - name: Report signing mode
        run: |
          if [ -n "$LOCUS_KEYSTORE_BASE64" ]; then
            echo 'APK signed with the release keystore.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'APK is debug-signed (no release keystore secrets). Do not distribute.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: locus-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release

      - name: Smoke test Windows release executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'build/windows/x64/runner/Release/locus_planner.exe'
          $temp = Join-Path $env:RUNNER_TEMP 'locus-smoke-appdata'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $env:APPDATA = $temp
          $env:LOCALAPPDATA = $temp
          $readyFile = Join-Path $temp 'planner-startup.ready'
          Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
          $env:LOCUS_SMOKE_READY_FILE = $readyFile
          $proc = Start-Process -FilePath $exe.Path -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $proc.Refresh()
              if ($proc.HasExited) { throw "Application exited early with code $($proc.ExitCode)" }
              if ($proc.MainWindowHandle -ne 0 -and (Test-Path $readyFile)) { $ready = $true; break }
            }
            if (-not $ready) { throw 'Planner did not render its first frame within 60 seconds' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
